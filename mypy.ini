[mypy]
ignore_missing_imports = True
plugins = sqlalchemy.ext.mypy.plugin

# SQLAlchemy Column[T] -> T resolution is handled by the plugin above.
# The remaining per-file ignores cover patterns that are valid at runtime
# but mypy can't verify without full SQLAlchemy 2.0 Mapped[] annotations.

[mypy-db.crud]
disable_error_code = assignment

[mypy-routers.auth]
disable_error_code = arg-type, misc

[mypy-routers.clients]
disable_error_code = arg-type, union-attr

[mypy-routers.onboarding]
disable_error_code = arg-type

[mypy-core.orchestrator]
disable_error_code = arg-type
