# CI for maas-backend — managed by Backstage (Edit pipeline flips the switches below), built on Loop.
# Every run ends with a scanned linux/arm64 image: ghcr.io/everesto-inc/maas-backend (pushed from main only).
# Gitleaks, Trivy scans and the image build always run. Add own jobs below with `needs: loop`.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'mkdocs.yml', 'catalog-info.yaml', '*.md']   # docs/settings only → no rebuild
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loop:
    uses: Everesto-Inc/loop/.github/workflows/pipeline.yml@d2145b8c2dd821a2a173b73507c98b4254c336a7 # v1.1.1
    with:
      stack: python
      runner: ubuntu-24.04-arm        # public repo → free native ARM runner (no QEMU emulation)
      tests: true
      semgrep: true
      sonarqube: true
      trivy: report
      sonar-args: -Dsonar.qualitygate.wait=false   # SonarQube reports but does not block — until MaaS has tests (coverage gate)
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # only what Loop needs — never `inherit` (least privilege)
    permissions:
      contents: read
      packages: write        # push + keep the last 5 images in ghcr.io
