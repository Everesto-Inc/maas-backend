name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/maas-backend
  VM_AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/maas-vm-agent
  LAPTOP_AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/maas-laptop-agent
  TAG: ${{ github.sha }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt ruff mypy pytest pytest-asyncio pytest-cov sqlalchemy[mypy]

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy . --ignore-missing-imports

      - name: Pytest
        run: pytest --cov=. --cov-report=xml -q
        continue-on-error: true   # TODO: add tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
        continue-on-error: true   # TODO: resolve flagged vulnerabilities

      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true   # TODO: resolve flagged packages

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.everesto.live
        continue-on-error: true   # requires SONAR_TOKEN secret

  build-push:
    name: Build & Push all images
    runs-on: ubuntu-latest
    needs: [security, sonarqube]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push vm-agent
        uses: docker/build-push-action@v5
        with:
          context: ./agents/vm_agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.VM_AGENT_IMAGE }}:${{ env.TAG }},${{ env.VM_AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=vm-agent
          cache-to: type=gha,scope=vm-agent,mode=max

      - name: Build & push laptop-agent
        uses: docker/build-push-action@v5
        with:
          context: ./agents/laptop_agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.LAPTOP_AGENT_IMAGE }}:${{ env.TAG }},${{ env.LAPTOP_AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=laptop-agent
          cache-to: type=gha,scope=laptop-agent,mode=max

  deploy:
    name: Deploy to dev (main only)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: everesto/maas-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update dev image tag in gitops repo
        run: |
          cd gitops
          sed -i "s|newTag:.*|newTag: ${{ env.TAG }}|" environments/dev/backend/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add environments/dev/backend/kustomization.yaml
          git commit -m "deploy(dev): maas-backend → ${{ env.TAG }}"
          git push
